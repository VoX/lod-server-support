plugins {
    // The single-branch multi-line build applies loom per fabric-ish module in its own
    // body (net.fabricmc.fabric-loom on official-mapping lines, net.fabricmc.fabric-loom-remap
    // on intermediary lines) keyed on line data — a plugins {} block cannot see line data.
    // Declaring it here (apply false) puts BOTH markers (one jar) on the plugin classpath.
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Root project — no source code here.
// Subprojects: common (pure Java), fabric (Fabric mod), paper (Paper plugin)

// Convenience aggregate for the Voxy Server Side branded pair (XANTHA's publish flow):
//   ./gradlew vssJars   ->  fabric/build/libs/voxy-server-side-fabric*.jar
//                           paper/build/libs/voxy-server-side-paper*.jar
//                           neoforge/build/libs/voxy-server-side-neoforge*.jar (stage N-4)
// Each platform's vssJar is a byte-copy rebrand of the LSS jar (wire-identical; see the
// vssJar tasks in fabric/ and paper/ build.gradle). Version-stamped names: CI=true.
tasks.register('vssJars') {
    description = 'Builds the Voxy Server Side branded jars (Fabric + Paper + NeoForge).'
    group = 'build'
    dependsOn ':fabric:vssJar', ':paper:vssJar', ':neoforge:vssJar'
}
