plugins {
    id 'java-library'
}

// Line data plane: per-line build dir + (for non-default lines) source assembly. common's
// toolchain stays Java 21 on every line — it is the loader-pure module. Its SOURCE can
// still diverge per line (e.g. wire/NativeSectionShape), resolved via the assembly.
apply from: "$rootDir/gradle/line.gradle"

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

// Non-default lines compile common from an assembled mirror (shared minus overlaid/cut +
// overlay wins). common has no MC deps, so its only per-line divergence is line-fact
// constants; overlays here are the transport, seams the eventual home.
if (project.mcLine != '26.2') {
    sourceSets.main.java.srcDirs = []
    sourceSets.main.java.srcDir assembleLineTree('commonMainJava',
            ['src/main/java'], ["src/line/${project.mcLine}/java"])
    sourceSets.main.resources.srcDirs = []
    sourceSets.main.resources.srcDir assembleLineTree('commonMainRes',
            ['src/main/resources'], ["src/line/${project.mcLine}/resources"])
}

dependencies {
    api 'org.slf4j:slf4j-api:2.0.18'
    compileOnly 'it.unimi.dsi:fastutil:8.5.18'
    // Provided at runtime by both platforms (Minecraft bundles GSON); compileOnly keeps it
    // out of the Paper shadow jar and the Fabric jar-in-jar, same pattern as fastutil.
    compileOnly 'com.google.code.gson:gson:2.13.2'
    // LOD store engine + codec (docs/planning/lod-store-implementation-plan.md §3).
    // compileOnly: each platform supplies the runtime — Fabric nests native-stripped
    // jar-in-jar copies (fabric/build.gradle slimStoreDepJars), Paper shades them into
    // the plugin jar WITHOUT relocating org.sqlite (relocation breaks its native loader).
    compileOnly 'org.xerial:sqlite-jdbc:3.49.1.0'
    compileOnly 'com.github.luben:zstd-jni:1.5.7-3'
}
