import groovy.json.JsonOutput
import java.security.MessageDigest
allprojects {
    afterEvaluate { p ->
        if (p.path == ':fabric') {
            def output = new File(System.getProperty('lss.smoke.evidence'))
            p.tasks.register('captureSmokeRuntime') {
                dependsOn p.tasks.named('classes'), p.tasks.named('configureLaunch'), p.tasks.named('jar')
                doLast {
                    if(output.exists())throw new GradleException("refuse existing native capture")
                    output.mkdirs()
                    def hash = { file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
                    def configuration = p.tasks.named('runClient').get().classpath
                    if (configuration == null) throw new GradleException('Missing actual runClient classpath')
                    def originalConfig = p.configurations.findByName('modRuntimeClasspath')
                    if (originalConfig == null || !originalConfig.canBeResolved) {
                        originalConfig = p.configurations.findByName('runtimeClasspath')
                        if(originalConfig==null || !originalConfig.canBeResolved)throw new GradleException('actual runtime dependency configuration missing')
                    }
                    def originals = originalConfig.files.findAll { it.isFile() }.collect { file -> [path:file.absolutePath,sha256:hash(file)] }
                    new File(output, 'original-mod-inputs.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(originals)) + '\n'
                    def files = configuration.files.collect { file ->
                        file.isFile() ? [path:file.absolutePath,sha256:hash(file),directory:false] : [path:file.absolutePath,directory:true,files:p.fileTree(file).files.sort { it.absolutePath }.collectEntries { item -> [(file.toPath().relativize(item.toPath()).toString()):hash(item)] }]
                    }
                    def candidate = p.tasks.named('jar').get().archiveFile.get().asFile
                    new File(output, 'named-candidate.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([path:candidate.absolutePath,sha256:hash(candidate)])) + '\n'
                    def remapFile = new File(p.rootProject.projectDir, '.gradle/loom-cache/projects/fabric/remapClasspath.txt')
                    new File(output, 'remap-classpath.txt').text = remapFile.exists()?remapFile.text:''
                    new File(output, 'target-components.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([[uid:'net.minecraft',version:p.rootProject.property('minecraft_version')],[uid:'net.fabricmc.fabric-loader',version:p.rootProject.property('loader_version')],[uid:'java',version:(p.rootProject.property('minecraft_version').toString().startsWith('26.')?'25':'21')]])) + '\n'
                    def launch = p.tasks.named('runClient').get()
                    new File(output, 'launch-settings.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([jvmArgs:launch.allJvmArgs, args:launch.args, mainClass:launch.mainClass.get(), workingDir:launch.workingDir.absolutePath])) + '\n'
                    new File(output, 'dli-config.txt').text = new File(p.rootProject.projectDir, '.gradle/loom-cache/projects/fabric/launch.cfg').text
                    new File(output, 'jvm-argfile.txt').text = new File(p.projectDir, 'build/loom-cache/argFiles/runClient').text
                    new File(output, 'runtime-classpath.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(files)) + '\n'
                }
            }
        }
    }
}
