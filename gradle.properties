org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.10
# V-1/P3 (version-port-isolation-plan.md): the fabric.mod.json 'minecraft' depends
# value — NOT derivable from minecraft_version (recorded forms: '>=26.2 <26.3-',
# '>=26.1 <26.2-', exact '1.21.11'), so it is explicit per-line data. Templated into
# the resource by :fabric:processResources; FabricModJsonContractTest pins the FORM.
minecraft_dependency=1.21.10
loader_version=0.19.3
loom_version=1.17.13

# Mod Properties
mod_version=0.21.1
maven_group=dev.vox
archives_base_name=lod-server-support-fabric

# Dependencies
fabric_version=0.138.4+1.21.10

# NeoForge (stage N line-flavored — neoforge-support-plan.md; the 1.21.10-family build)
neoforge_version=21.10.64

# Map-ingestion live gates only (-Plss.journeymapRuntime / -Plss.xaeroRuntime): Modrinth
# version ids of the pinned JourneyMap (1.21.10-6.0.0-beta.58+fabric, UNSUPPORTED by map ingestion) and Xaero WM (1.21.10-1.45.0) builds.
journeymap_dev_version=q7s86gFk
# The JourneyMap builds Tier 1's binding-surface test pins as UNSUPPORTED on this line (map-ingestion
# plan D5, §6.1, Modrinth version ids). A future 1.21.10 JourneyMap with the snapshot layer reds it.
journeymap_golden_fabric=q7s86gFk
journeymap_golden_neoforge=3QAEEUt8
xaero_dev_version=J2D6Ac47
# The Xaero's World Map builds Tier 1's binding-surface and loadPixel parity tests load
# (cave-layers plan §B7/§B9, Modrinth version ids): this line's newest build on both loaders
# (WM 1.47.0) and its floor (the oldest 1.21.10 build the bridge supports, WM 1.42.0 Fabric).
# Bump with the line's supported Xaero.
xaero_golden_fabric=rWIkQfu0
xaero_golden_neoforge=fytJSQHJ
xaero_golden_floor_fabric=7nUknR6l
# The legacy (0.6/0.7) Sodium options-API artifact SodiumLegacySurfaceResolvesTest checks
# LegacySodiumPage.SURFACE against (sodium-options-page-generations-plan.md §4): the
# Mojang-mapped NeoForge build so member names read unremapped. THIS line is the
# 0.7-only line, so it pins its own 0.7.3 (the setTooltip(Function) overload
# generation). No sodium_version here: 1.21.10 has no 0.8 artifact, so the modern
# golden arm is deliberately unresolvable (fabric/build.gradle guards on the property).
sodium_legacy_golden=mc1.21.10-0.7.3-neoforge

# Explicit CI Java 21 installation for common:test while the line build uses its own JDK.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Sponge (sponge-support-plan.md §0.1/§4). Pin policy: the RECOMMENDED SpongeVanilla build
# where one exists, else the newest RC; the compile API is a release where one exists,
# else a TIMESTAMPED snapshot (never a floating -SNAPSHOT). The Sponge MC version is
# minecraft_version itself. spongevanilla_sha1 verifies the downloaded server jar (boot
# smoke, test-server.sh run-sponge, the native server-smoke rig).
sponge_api_version=17.0.0
sponge_api_dependency=[17.0.0,18.0.0)
spongevanilla_version=1.21.10-17.0.0
spongevanilla_sha1=e5479957aa6a7ed15975f9f26985cf2b1f385295
vanillagradle_version=0.2.2
