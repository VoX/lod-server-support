org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
# V-1/P3 (version-port-isolation-plan.md): the fabric.mod.json 'minecraft' depends
# value — NOT derivable from minecraft_version (recorded forms: '>=26.2 <26.3-',
# '>=26.1 <26.2-', exact '1.21.11'), so it is explicit per-line data. Templated into
# the resource by :fabric:processResources; FabricModJsonContractTest pins the FORM.
minecraft_dependency=1.21.1
# fabric_api_dependency joined at the G back-flow: the 26.1 port found the literal
# floor naming a 26.2-family version — every line's floor is its own API family.
fabric_api_dependency=>=0.100.0
loader_version=0.19.3
loom_version=1.17.13

# Mod Properties
mod_version=0.14.0
maven_group=dev.vox
archives_base_name=lod-server-support-fabric

# Dependencies
fabric_version=0.116.15+1.21.1

# NeoForge (stage N — neoforge-support-plan.md; non-beta 26.2 build, spike-verified)
neoforge_version=21.1.248

# Consumed ONLY by the modern golden arm (SodiumLegacySurfaceResolvesTest checks
# SodiumConfigScreens.MODERN_SURFACE against the line's own 0.8 artifact — the DUAL
# line: 0.8.13-beta.2 here, 0.6.13 on the NeoForge Voxy-fork path); the compile
# dependency stays the literal in fabric/build.gradle (this line predates R2-6).
sodium_version=mc1.21.1-0.8.13-beta.2-fabric
# The legacy (0.6/0.7) Sodium options-API artifact SodiumLegacySurfaceResolvesTest checks
# LegacySodiumPage.SURFACE against (sodium-options-page-generations-plan.md §4): the
# Mojang-mapped NeoForge build so member names read unremapped; the legacy surface is
# generation-invariant, so main pins the 1.21.1 0.6.13 build. A 0.7-only line may point
# at its own (mc1.21.10-0.7.3-neoforge). Resolved outside loom, never on a test classpath.
sodium_legacy_golden=mc1.21.1-0.6.13-neoforge
