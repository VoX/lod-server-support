org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
# V-1/P3 (version-port-isolation-plan.md): the fabric.mod.json 'minecraft' depends
# value — NOT derivable from minecraft_version (recorded forms: '>=26.2 <26.3-',
# '>=26.1 <26.2-', exact '1.21.11'), so it is explicit per-line data. Templated into
# the resource by :fabric:processResources; FabricModJsonContractTest pins the FORM.
minecraft_dependency=>=26.2 <26.3-
# fabric_api_dependency joined at the G back-flow: the 26.1 port found the literal
# floor naming a 26.2-family version — every line's floor is its own API family.
fabric_api_dependency=>=0.152.1
loader_version=0.19.3
loom_version=1.17.13

# Mod Properties
mod_version=0.22.0
maven_group=dev.vox
archives_base_name=lod-server-support-fabric

# Dependencies
fabric_version=0.154.0+26.2

# NeoForge (stage N — neoforge-support-plan.md; non-beta 26.2 build, spike-verified)
neoforge_version=26.2.0.59

# Sponge (sponge-support-plan.md §0.1/§4). Pin policy: the RECOMMENDED SpongeVanilla build
# where one exists, else the newest RC; the compile API is a release where one exists,
# else a TIMESTAMPED snapshot (never a floating -SNAPSHOT). The Sponge MC version is
# minecraft_version itself. spongevanilla_sha1 verifies the downloaded server jar (boot
# smoke, test-server.sh run-sponge, the native server-smoke rig).
sponge_api_version=20.0.0-20261005.184902-4
sponge_api_dependency=[20.0.0-SNAPSHOT,21.0.0)
spongevanilla_version=26.2-20.0.0-RC2743
spongevanilla_sha1=7c82e765227f92c794788822b17994e34660a05d
vanillagradle_version=0.3.2

# Third-party coordinates as LINE DATA (R2-6) — consumed by fabric/build.gradle
# (compileOnly + the compat localRuntime arms) and templated into fabric.mod.json's
# suggests. Stale copies of these shipped on all three v0.11 ports; one source now.
sodium_version=mc26.2-0.9.1-beta.3-fabric
modmenu_version=20.0.0-beta.4
moonrise_modrinth_version=W0HImEBl
c2me_modrinth_version=JRbWYiJa
# Map-ingestion live gates only (-Plss.journeymapRuntime / -Plss.xaeroRuntime): Modrinth
# version ids of the pinned JourneyMap (26.2-6.0.10+fabric) and Xaero WM builds.
journeymap_dev_version=C6LURNke
# The JourneyMap builds Tier 1's binding-surface and decoder-parity tests load (map-ingestion
# plan §6.1, Modrinth version ids). Bump BOTH with the line's supported JourneyMap.
journeymap_golden_fabric=C6LURNke
journeymap_golden_neoforge=S0bNIQSq
xaero_dev_version=Z6wZaeAX
# The Xaero's World Map builds Tier 1's binding-surface and loadPixel parity tests load
# (cave-layers plan §B7/§B9, Modrinth version ids): this line's newest build on both loaders
# (WM 1.47.0) and its floor (the oldest 26.2 build the bridge supports, WM 1.42.0 Fabric).
# Bump with the line's supported Xaero.
xaero_golden_fabric=ebWaQDqf
xaero_golden_neoforge=dlK1uwnF
xaero_golden_floor_fabric=JN72jos8
suggests_sodium=>=0.9.0
# The legacy (0.6/0.7) Sodium options-API artifact SodiumLegacySurfaceResolvesTest checks
# LegacySodiumPage.SURFACE against (sodium-options-page-generations-plan.md §4): the
# Mojang-mapped NeoForge build so member names read unremapped; the legacy surface is
# generation-invariant, so main pins the 1.21.1 0.6.13 build. A 0.7-only line may point
# at its own (mc1.21.10-0.7.3-neoforge). Resolved outside loom, never on a test classpath.
sodium_legacy_golden=mc1.21.1-0.6.13-neoforge
suggests_voxy=>=0.2.17-alpha

# Explicit CI Java 21 installation for common:test while the line build uses its own JDK.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
