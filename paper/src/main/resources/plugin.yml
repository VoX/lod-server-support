name: LodServerSupport
version: '${version}'
main: dev.vox.lss.paper.LSSPaperPlugin
api-version: '${api_version}'
# Version guard (paper-version-guard-store-plan §3.1): api-version only refuses an OLDER
# server. This is the line's minecraft_dependency (the rule fabric.mod.json declares),
# templated from gradle.properties; onEnable disables the plugin when the running
# Minecraft version does not satisfy it. Not a Paper key — Bukkit ignores it.
lss-minecraft-dependency: '${minecraft_dependency}'
# 1.21.1 line: folia-supported is ABSENT — Folia never published a 1.21.1 build (its 1.21
# family starts at 1.21.4; fill.papermc.io verified 2026-08-15), so declaring the flag
# would claim support for a platform that does not exist (the pre-26.2 precedent).
# PluginYmlContractTest + release_check.py pin the ABSENCE on this line (surfaces row 7 —
# the fresh cut re-derives the direction; the Folia code paths stay in the jar, inert).
# C5 (XVER §7): the Via mismatch guard reflectively reads ViaVersion's API when the
# plugin is present. softdepend keeps Spigot's classloader from logging the one-time
# "loaded class ... which is not a depend/softdepend" warning on the first handshake —
# noise that reads like an LSS bug. No hard dependency: without Via the probe is a
# silent no-signal. LibsDisguises (issue #282): the far-player privacy ladder reads
# DisguiseAPI reflectively to hide disguised players — same precedent (load ORDER +
# classloader visibility, never a hard depend; absent = the rung is skipped).
softdepend: [ViaVersion, LibsDisguises]
description: Voxy multiplayer support (unofficial). Enables players with Voxy to see fully rendered terrain out to hundreds of chunks on multiplayer servers without needing to explore the world first.
author: VoX
website: https://modrinth.com/plugin/lod-server-support
commands:
  lsslod:
    description: LOD Server Support admin commands
    usage: /lsslod <stats|diag|diagnostics|store|reload|help>
    permission: lss.admin
permissions:
  lss.admin:
    description: Access to LSS admin commands
    default: op
  # Far players: since 0.21.0 this permission hides nobody by itself. A grant of every
  # permission ("*") includes it, which used to hide every admin; players now hide
  # themselves with Share My Position in their own settings. Holders are hidden only
  # while the server sets far_players.hide_permission_holders: true (the behaviour
  # before 0.21.0). In far_players.mode "required" nobody can opt out of being shown
  # except a holder: there the permission is what lets a player hide with Share My
  # Position. BOTH brand spellings are declared (default false) and either one
  # counts: Bukkit resolves an UNDECLARED node to the op default, so a single-brand
  # declaration plus a cross-brand check would silently make every op a holder — and
  # declaring both keeps the grant working across an LSS<->VSS jar swap.
  lss.farplayers.hidden:
    description: Hides the player from far-player rendering, only while far_players.hide_permission_holders is true (off by default). In far_players.mode required it is what lets the player hide with Share My Position (in mode on every player can)
    default: false
  vss.farplayers.hidden:
    description: Hides the player from far-player rendering, only while far_players.hide_permission_holders is true. In far_players.mode required it is what lets the player hide with Share My Position (VSS spelling)
    default: false
  # Service gate (requireServicePermission, default false): with the config key on, only
  # holders are served LOD data — a handshake from anyone else is answered with an
  # enabled=false SessionConfig and no session. BOTH brand spellings are declared for the
  # reason spelled out on lss.farplayers.hidden above (Bukkit resolves an UNDECLARED node to
  # the op default, so a single-brand declaration plus a cross-brand check goes silently
  # wrong, and declaring both keeps grants alive across an LSS<->VSS jar swap).
  #
  # `default: true`, NOT op: everyone holds these unless an admin says otherwise, so arming
  # the gate on its own changes nothing for anybody — the original behavior, preserved. The
  # gate is a DENY tool: the only thing that takes LOD away is an explicit negative grant in
  # the permission plugin (e.g. LuckPerms `group default permission set lss.use false`).
  #
  # Enforcement requires BOTH spellings, so a negative grant on EITHER one denies — the De
  # Morgan mirror of the privacy nodes above (grant model: hold EITHER; deny model: lose
  # EITHER). An OR here would be inert: the spelling the admin did NOT touch still resolves
  # to its declared `true` and would out-vote the single negative grant.
  #
  # That direction is also why losing either declaration is dangerous: an undeclared node
  # falls back to Bukkit's op default, silently turning "everyone" into "ops only".
  lss.use:
    description: Receive LOD data when requireServicePermission is enabled
    default: true
  vss.use:
    description: Receive LOD data when requireServicePermission is enabled (VSS spelling)
    default: true
  # Map-ingestion exemption (privacy.request_no_map_ingestion, default off): while that request
  # is on, holders may still add distant terrain to their world maps (Xaero's World Map,
  # JourneyMap) — the server treats the request as off for them. A GRANT model like the
  # far-player privacy nodes: holding EITHER spelling exempts, both spellings are declared for
  # the same Bukkit undeclared-node reason, and both default to false. NOT op: an op default
  # would silently exempt every op on a server that turned the request on.
  lss.map_ingestion:
    description: Exempts the player from privacy.request_no_map_ingestion (may add distant terrain to world maps)
    default: false
  vss.map_ingestion:
    description: Exempts the player from privacy.request_no_map_ingestion (VSS spelling)
    default: false
