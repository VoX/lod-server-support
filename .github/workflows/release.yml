name: Release

# Single-branch, single-tag release (single-branch-consolidation-plan.md §5). ONE annotated
# tag `vX.Y.Z` drives a four-stage pipeline that publishes EVERY release-ready line:
#   build (matrix) -> github-release (fan-in, DRAFT) -> modrinth (matrix) -> finalize (publish).
# The stages exist to make ~15 irreversible actions on one trigger safe: nothing publishes
# until every full-tier line built green, the release is assembled as a DRAFT and only
# flipped to published at the end, and Modrinth publishing is idempotent per line×loader
# (so `gh run rerun --failed` re-runs exactly the failed line, never a duplicate).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the pipeline (build + assemble, NO publish)'
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.derive.outputs.mod_version }}
      release_matrix: ${{ steps.gen.outputs.release_matrix }}
      notes: ${{ steps.notes.outputs.notes }}
      is_dry: ${{ steps.mode.outputs.is_dry }}
    steps:
      - uses: actions/checkout@v5

      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry=false" >> "$GITHUB_OUTPUT"
          fi

      # A real publish requires an annotated tag. A non-dry dispatch is refused (no tag,
      # no notes, no version). A dry dispatch rehearses build+assemble only.
      - name: Refuse non-dry dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          echo "::error::workflow_dispatch cannot real-publish — push an annotated tag."
          exit 1

      - id: derive
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            MV="${TAG#v}"
            case "$MV" in
              [0-9]*.[0-9]*.[0-9]*) echo "mod_version=$MV" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::tag '${TAG}' does not derive a numeric mod version ('$MV')"; exit 1 ;;
            esac
          else
            echo "mod_version=0.0.0-dry" >> "$GITHUB_OUTPUT"
          fi

      - id: gen
        run: python3 .github/workflows/gen_matrix.py >> "$GITHUB_OUTPUT"

      # Extract the annotated-tag message ONCE (the lightweight-tag force-fetch repair runs
      # here, not once per line). PREV_TAG keeps `grep -v '+mc'` forever (the historical
      # per-line tag family stays in the repo).
      - id: notes
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
            TAG_TYPE=$(git for-each-ref --format='%(objecttype)' "refs/tags/${TAG}")
            if [ "$TAG_TYPE" = "tag" ]; then
              NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")
            else
              PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v '+mc' | grep -v "^${TAG}$" | head -1 || true)
              NOTES=$(git log --pretty='- %s' "${PREV_TAG:+$PREV_TAG..}${TAG}" 2>/dev/null || git log --pretty='- %s' -20)
            fi
          else
            NOTES="(dry-run rehearsal — no notes)"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ Stage 1: build
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.release_matrix) }}
    name: Build ${{ matrix.line }}
    runs-on: ubuntu-latest
    # 26.x (official) lines GATE; 1.21.x (intermediary) are continue-on-error so a
    # best-effort flake never blocks the 26.x release.
    continue-on-error: ${{ matrix.gates != 'true' }}
    env:
      MOD_VERSION: ${{ needs.setup.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5

      - name: Build Fabric
        run: ./gradlew -PmcLine=${{ matrix.line }} :fabric:build -x runClientGameTest -Pmod_version=${MOD_VERSION}
      - name: Build Paper + Tier 1 tests
        run: ./gradlew -PmcLine=${{ matrix.line }} :paper:test :paper:shadowJar -Pmod_version=${MOD_VERSION}
      - name: Build NeoForge + contract tests
        if: matrix.ship_neoforge == 'true'
        run: ./gradlew -PmcLine=${{ matrix.line }} :neoforge:build -Pmod_version=${MOD_VERSION}

      - name: Release-jar safety gate
        run: python3 scripts/release_check.py --line ${{ matrix.line }} --version "${MOD_VERSION}"

      - name: Upload line artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-jars-${{ matrix.line }}
          path: |
            fabric/build/${{ matrix.build_subdir }}libs/lod-server-support-fabric-*.jar
            paper/build/${{ matrix.build_subdir }}libs/lod-server-support-paper-*.jar
            neoforge/build/${{ matrix.build_subdir }}libs/lod-server-support-neoforge-*.jar
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------- Stage 2: github-release (DRAFT)
  github-release:
    needs: [setup, build]
    if: needs.setup.outputs.is_dry == 'false' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all line artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-jars-*
          path: dist
          merge-multiple: true
      - name: Create DRAFT release with all lines' assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: ${{ needs.setup.outputs.notes }}
          fail_on_unmatched_files: true
          make_latest: 'true'
          files: dist/*.jar

  # ------------------------------------------------------------------ Stage 3: modrinth
  modrinth:
    needs: [setup, github-release]
    if: needs.setup.outputs.is_dry == 'false' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.release_matrix) }}
    name: Modrinth ${{ matrix.line }}
    continue-on-error: ${{ matrix.gates != 'true' }}
    env:
      MOD_VERSION: ${{ needs.setup.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Download this line's artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-jars-${{ matrix.line }}
          path: dist

      # Idempotency is OURS: Modrinth accepts duplicate version_numbers silently, so a
      # rerun would create duplicates. Pre-check each version_number and skip if present.
      - id: precheck
        run: |
          check() {
            local vn="$1"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.modrinth.com/v2/project/lKiXKLvv/version/$vn")
            [ "$code" = "200" ] && echo "present" || echo "absent"
          }
          echo "fabric=$(check "v${MOD_VERSION}+fabric+mc${{ matrix.mc_fabric }}")" >> "$GITHUB_OUTPUT"
          echo "paper=$(check "v${MOD_VERSION}+paper+mc${{ matrix.mc_paper }}")" >> "$GITHUB_OUTPUT"
          echo "neoforge=$(check "v${MOD_VERSION}+neoforge+mc${{ matrix.mc_neoforge }}")" >> "$GITHUB_OUTPUT"

      - name: Publish Fabric
        if: steps.precheck.outputs.fabric == 'absent'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/lod-server-support-fabric-*.jar
          name: v${{ env.MOD_VERSION }} - Fabric (MC ${{ matrix.mc_fabric }})
          version: v${{ env.MOD_VERSION }}+fabric+mc${{ matrix.mc_fabric }}
          version-type: release
          loaders: fabric
          game-versions: ${{ matrix.gv_fabric }}
          changelog: ${{ needs.setup.outputs.notes }}

      - name: Publish Paper
        if: steps.precheck.outputs.paper == 'absent'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/lod-server-support-paper-*.jar
          name: v${{ env.MOD_VERSION }} - Paper (MC ${{ matrix.mc_paper }})
          version: v${{ env.MOD_VERSION }}+paper+mc${{ matrix.mc_paper }}
          version-type: release
          loaders: ${{ matrix.paper_loaders }}
          game-versions: ${{ matrix.gv_paper }}
          changelog: ${{ needs.setup.outputs.notes }}

      - name: Publish NeoForge
        if: matrix.ship_neoforge == 'true' && steps.precheck.outputs.neoforge == 'absent'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/lod-server-support-neoforge-*.jar
          name: v${{ env.MOD_VERSION }} - ${{ matrix.neoforge_name }}
          version: v${{ env.MOD_VERSION }}+neoforge+mc${{ matrix.mc_neoforge }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ matrix.gv_neoforge }}
          changelog: ${{ needs.setup.outputs.notes }}

  # ------------------------------------------------------------------ Stage 4: finalize
  finalize:
    needs: [setup, modrinth]
    if: needs.setup.outputs.is_dry == 'false' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the GitHub release (draft -> live)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
