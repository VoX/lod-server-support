name: Release

# Single-branch, single-tag release (single-branch-consolidation-plan.md §5). ONE annotated
# tag `vX.Y.Z` drives a four-stage pipeline that publishes EVERY release-ready line:
#   build (matrix) -> github-release (fan-in, DRAFT) -> modrinth (matrix) -> finalize (publish).
# The stages exist to make ~15 irreversible actions on one trigger safe: nothing publishes
# until every full-tier line built green, the release is assembled as a DRAFT and only
# flipped to published at the end, and Modrinth publishing is idempotent per line×loader
# (so `gh run rerun --failed` re-runs exactly the failed line, never a duplicate).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the pipeline (build + assemble, NO publish)'
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.derive.outputs.mod_version }}
      release_matrix: ${{ steps.gen.outputs.release_matrix }}
      notes: ${{ steps.notes.outputs.notes }}
      is_dry: ${{ steps.mode.outputs.is_dry }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # notes fallback + PREV_TAG need the full tag/history graph

      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry=false" >> "$GITHUB_OUTPUT"
          fi

      # A real publish requires an annotated tag. A non-dry dispatch is refused (no tag,
      # no notes, no version). A dry dispatch rehearses build+assemble only.
      - name: Refuse non-dry dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          echo "::error::workflow_dispatch cannot real-publish — push an annotated tag."
          exit 1

      - id: derive
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            MV="${TAG#v}"
            # Single-branch: the ONLY valid release tag is a bare vX.Y.Z. An anchored regex
            # (not a shell glob — `[0-9]*.[0-9]*.[0-9]*` also matches `0.14.0+mc26.1` and would
            # publish ~15 junk-named artifacts from five-line muscle-memory tags).
            if echo "$MV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "mod_version=$MV" >> "$GITHUB_OUTPUT"
            else
              echo "::error::tag '${TAG}' is not a bare vX.Y.Z release tag (got mod version '$MV') — "
              echo "::error::the single-branch pipeline publishes every line from one bare tag; no '+mc' suffix."
              exit 1
            fi
          else
            echo "mod_version=0.0.0-dry" >> "$GITHUB_OUTPUT"
          fi

      - id: gen
        run: python3 .github/workflows/gen_matrix.py >> "$GITHUB_OUTPUT"

      # Extract the annotated-tag message ONCE (the lightweight-tag force-fetch repair runs
      # here, not once per line). PREV_TAG keeps `grep -v '+mc'` forever (the historical
      # per-line tag family stays in the repo).
      - id: notes
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
            TAG_TYPE=$(git for-each-ref --format='%(objecttype)' "refs/tags/${TAG}")
            if [ "$TAG_TYPE" = "tag" ]; then
              NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")
            else
              PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v '+mc' | grep -v "^${TAG}$" | head -1 || true)
              NOTES=$(git log --pretty='- %s' "${PREV_TAG:+$PREV_TAG..}${TAG}" 2>/dev/null || git log --pretty='- %s' -20)
            fi
          else
            NOTES="(dry-run rehearsal — no notes)"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ Stage 1: build
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.release_matrix) }}
    name: Build ${{ matrix.line }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 26.x (official) lines GATE; 1.21.x (intermediary) are continue-on-error so a
    # best-effort flake never blocks the 26.x release.
    continue-on-error: ${{ matrix.gates != 'true' }}
    env:
      MOD_VERSION: ${{ needs.setup.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5

      - name: Build Fabric
        run: ./gradlew -PmcLine=${{ matrix.line }} :fabric:build -x runClientGameTest -Pmod_version=${MOD_VERSION}
      - name: Build Paper + Tier 1 tests
        run: ./gradlew -PmcLine=${{ matrix.line }} :paper:test :paper:shadowJar -Pmod_version=${MOD_VERSION}
      - name: Build NeoForge + contract tests
        if: matrix.ship_neoforge == 'true'
        run: ./gradlew -PmcLine=${{ matrix.line }} :neoforge:build -Pmod_version=${MOD_VERSION}

      - name: Release-jar safety gate
        run: python3 scripts/release_check.py --line ${{ matrix.line }} --version "${MOD_VERSION}"

      # Stage the LSS release jars FLAT (upload-artifact stores files relative to the least
      # common ancestor of the paths — three module paths make that the repo root, so the
      # downstream `dist/*.jar` glob would match nothing). Staging flat makes the artifact bare
      # jars. VSS jars are built (release_check gates them) but stay OUT of the release — VSS
      # publishes locally, never via CI.
      - name: Stage release jars
        run: |
          set -euo pipefail
          mkdir -p staging
          sub='${{ matrix.build_subdir }}'
          for m in fabric paper neoforge; do
            d="$m/build/${sub}libs"
            find "$d" -maxdepth 1 -name "lod-server-support-$m-*.jar" -exec cp -v {} staging/ \; 2>/dev/null || true
          done
          echo "staged:"; ls -1 staging/

      - name: Upload line artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-jars-${{ matrix.line }}
          path: staging/*.jar
          if-no-files-found: error   # a gating line with no jar must fail, not silently vanish
          retention-days: 7

  # ---------------------------------------------------- Stage 2: github-release (DRAFT)
  github-release:
    needs: [setup, build]
    if: needs.setup.outputs.is_dry == 'false' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the repo default token is READ — draft creation 403s without this
    steps:
      - name: Download all line artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-jars-*
          path: dist
          merge-multiple: true
      - name: Create DRAFT release with all lines' assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: ${{ needs.setup.outputs.notes }}
          fail_on_unmatched_files: true
          make_latest: 'true'
          files: dist/*.jar

  # ------------------------------------------------------------------ Stage 3: modrinth
  modrinth:
    needs: [setup, github-release]
    if: needs.setup.outputs.is_dry == 'false' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.release_matrix) }}
    name: Modrinth ${{ matrix.line }}
    continue-on-error: ${{ matrix.gates != 'true' }}
    env:
      MOD_VERSION: ${{ needs.setup.outputs.mod_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Download this line's artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-jars-${{ matrix.line }}
          path: dist

      # line.env carries loaders/game-versions as SPACE-separated single lines; mc-publish
      # wants a newline (or comma) list — a raw space string is read as ONE loader named
      # "paper purpur folia". Expand to newline lists, and derive the Paper display prose.
      - id: lists
        run: |
          nl() { tr ' ' '\n' <<< "$1"; }
          {
            printf 'gv_fabric<<EOF\n%s\nEOF\n' "$(nl '${{ matrix.gv_fabric }}')"
            printf 'gv_paper<<EOF\n%s\nEOF\n' "$(nl '${{ matrix.gv_paper }}')"
            printf 'gv_neoforge<<EOF\n%s\nEOF\n' "$(nl '${{ matrix.gv_neoforge }}')"
            printf 'paper_loaders<<EOF\n%s\nEOF\n' "$(nl '${{ matrix.paper_loaders }}')"
          } >> "$GITHUB_OUTPUT"
          disp=""
          for l in ${{ matrix.paper_loaders }}; do
            c="$(tr '[:lower:]' '[:upper:]' <<< "${l:0:1}")${l:1}"
            disp="${disp:+$disp/}$c"
          done
          echo "paper_display=$disp" >> "$GITHUB_OUTPUT"

      # Idempotency is OURS: Modrinth accepts duplicate version_numbers silently, so a rerun
      # would create duplicates. Pre-check each version_number and FAIL CLOSED on an
      # inconclusive probe (429/5xx/timeout) — only a genuine 404 proves absence; anything
      # else must block the publish, never fall through to a duplicate.
      - id: precheck
        run: |
          set -euo pipefail
          probe() {  # $1=version_number -> present|absent, or exit 1 (inconclusive)
            local code
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' \
              "https://api.modrinth.com/v2/project/lKiXKLvv/version/$1" || echo 000)
            case "$code" in
              200) echo present ;;
              404) echo absent ;;
              *) echo "::error::Modrinth precheck for $1 inconclusive (HTTP $code) — fail-closed, not publishing" >&2; return 1 ;;
            esac
          }
          f=$(probe "v${MOD_VERSION}+fabric+mc${{ matrix.mc_fabric }}")
          p=$(probe "v${MOD_VERSION}+paper+mc${{ matrix.mc_paper }}")
          n=$(probe "v${MOD_VERSION}+neoforge+mc${{ matrix.mc_neoforge }}")
          { echo "fabric=$f"; echo "paper=$p"; echo "neoforge=$n"; } >> "$GITHUB_OUTPUT"

      - name: Publish Fabric
        if: steps.precheck.outputs.fabric == 'absent'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/lod-server-support-fabric-*.jar
          name: v${{ env.MOD_VERSION }} - Fabric (MC ${{ matrix.mc_fabric }})
          version: v${{ env.MOD_VERSION }}+fabric+mc${{ matrix.mc_fabric }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.lists.outputs.gv_fabric }}
          changelog: ${{ needs.setup.outputs.notes }}

      - name: Publish Paper
        if: steps.precheck.outputs.paper == 'absent'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/lod-server-support-paper-*.jar
          name: v${{ env.MOD_VERSION }} - ${{ steps.lists.outputs.paper_display }} (MC ${{ matrix.mc_paper }})
          version: v${{ env.MOD_VERSION }}+paper+mc${{ matrix.mc_paper }}
          version-type: release
          loaders: ${{ steps.lists.outputs.paper_loaders }}
          game-versions: ${{ steps.lists.outputs.gv_paper }}
          changelog: ${{ needs.setup.outputs.notes }}

      - name: Publish NeoForge
        if: matrix.ship_neoforge == 'true' && steps.precheck.outputs.neoforge == 'absent'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/lod-server-support-neoforge-*.jar
          name: v${{ env.MOD_VERSION }} - ${{ matrix.neoforge_name }}
          version: v${{ env.MOD_VERSION }}+neoforge+mc${{ matrix.mc_neoforge }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.lists.outputs.gv_neoforge }}
          changelog: ${{ needs.setup.outputs.notes }}

  # ------------------------------------------------------------------ Stage 4: finalize
  finalize:
    needs: [setup, modrinth]
    if: needs.setup.outputs.is_dry == 'false' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release edit needs write
    steps:
      - uses: actions/checkout@v5
      # NOTE (CLAUDE.md release discipline): do NOT `gh run rerun` a PARTIALLY-published
      # release — a rerun rebuilds byte-different jars and can create duplicate Modrinth
      # versions. The stage-3 precheck makes a rerun of a fully-published release idempotent,
      # but a rerun mid-publish is still hand-recovery. `release-jars-*` artifacts retain 7
      # days; a recovery later than that must re-tag.
      - name: Publish the GitHub release (draft -> live)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
