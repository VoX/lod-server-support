name: Build

on:
  # NB: no workflow-level paths-ignore — the docs-only decision lives in the `changes` JOB
  # below so that `required-checks` (the single required status check) always RUNS and REPORTS,
  # instead of deadlocking a docs-only PR in a permanent Pending state.
  push:
    branches: [main, 'support/**']
  pull_request:
    branches: [main, 'support/**']

# One in-flight run per ref (the matrix multiplies runner-minutes; cancel superseded pushes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only detection as a JOB (not a workflow paths-ignore) so required-checks still reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.sha }}"
          if [ -z "$base" ] || ! git rev-parse -q --verify "${base}^{commit}" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0   # can't diff (first push etc.) → run everything
          fi
          # code=true iff any changed path is NOT docs/markdown/license/gitignore.
          if git diff --name-only "$base" "$head" | grep -qvE '^([^ ]*\.md|docs/|LICENSE$|\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The matrix is GENERATED from lines/ (never a literal list — keeps the no-hardcoded-MC
  # pin in its strongest form). Cross-pinned to lines/* by LineMatrixContractTest.
  setup:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.gen.outputs.build_matrix }}
      tier3_matrix: ${{ steps.gen.outputs.tier3_matrix }}
      compile_matrix: ${{ steps.gen.outputs.compile_matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: gen
        run: python3 .github/workflows/gen_matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false   # MANDATORY — the cross-line signal is the whole point.
      matrix:
        include: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    name: Build ${{ matrix.line }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Source line env
        run: grep -vE '^\s*(#|$)' lines/${{ matrix.line }}/line.env >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Fabric + Tier 1 tests
        run: ./gradlew -PmcLine=${{ matrix.line }} :fabric:build -x runGameTest -x runClientGameTest

      - name: Tier 2 server gametests (retry once on flake)
        run: |
          ./gradlew -PmcLine=${{ matrix.line }} :fabric:runGameTest || {
            echo "::warning title=Tier 2 gametest flake (${{ matrix.line }})::runGameTest failed once; retrying"
            mkdir -p flake-evidence/tier2
            cp -r fabric/build/${{ matrix.build_subdir }}run/gameTest/logs flake-evidence/tier2/logs 2>/dev/null || true
            cp -r fabric/build/${{ matrix.build_subdir }}run/gameTest/crash-reports flake-evidence/tier2/crash-reports 2>/dev/null || true
            ./gradlew -PmcLine=${{ matrix.line }} :fabric:runGameTest
          }

      - name: Build Paper plugin
        run: ./gradlew -PmcLine=${{ matrix.line }} :paper:shadowJar

      - name: Paper Tier 1 tests
        run: ./gradlew -PmcLine=${{ matrix.line }} :paper:test

      # build.yml builds + tests the NeoForge module on EVERY line so the port stays
      # maintained (whether the line SHIPS it is LINE_SHIP_NEOFORGE, a release-time fact).
      - name: Build NeoForge + contract tests
        run: ./gradlew -PmcLine=${{ matrix.line }} :neoforge:build

      - name: NeoForge gametest smoke (retry once on flake)
        run: |
          ./gradlew -PmcLine=${{ matrix.line }} :neoforge:runGameTestServer || {
            echo "::warning title=NeoForge gametest flake (${{ matrix.line }})::runGameTestServer failed once; retrying"
            mkdir -p flake-evidence/neoforge
            cp -r neoforge/run/logs flake-evidence/neoforge/logs 2>/dev/null || true
            cp -r neoforge/run/crash-reports flake-evidence/neoforge/crash-reports 2>/dev/null || true
            ./gradlew -PmcLine=${{ matrix.line }} :neoforge:runGameTestServer
          }

      - name: Script selftests
        run: |
          python3 scripts/check_soak.py --selftest
          python3 scripts/soak_report.py --selftest
          python3 scripts/release_check.py --selftest
          python3 scripts/check_move_trace.py --selftest
          python3 scripts/compare_profile.py --selftest
          python3 .github/workflows/gen_matrix.py --selftest

      - name: Release-jar safety gate
        run: python3 scripts/release_check.py --line ${{ matrix.line }}

      - name: Upload flake evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-flake-evidence-server-${{ matrix.line }}
          path: flake-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-failure-evidence-server-${{ matrix.line }}
          path: |
            fabric/build/${{ matrix.build_subdir }}run/*/logs/
            fabric/build/${{ matrix.build_subdir }}run/*/crash-reports/
            fabric/build/${{ matrix.build_subdir }}reports/
            fabric/build/${{ matrix.build_subdir }}test-results/
            paper/build/${{ matrix.build_subdir }}reports/
            paper/build/${{ matrix.build_subdir }}test-results/
            neoforge/build/${{ matrix.build_subdir }}reports/
            neoforge/build/${{ matrix.build_subdir }}test-results/
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-fabric-${{ matrix.line }}
          path: fabric/build/${{ matrix.build_subdir }}libs/lod-server-support-fabric*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-paper-${{ matrix.line }}
          path: paper/build/${{ matrix.build_subdir }}libs/lod-server-support-paper*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-fabric-${{ matrix.line }}
          path: fabric/build/${{ matrix.build_subdir }}libs/voxy-server-side-fabric*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-paper-${{ matrix.line }}
          path: paper/build/${{ matrix.build_subdir }}libs/voxy-server-side-paper*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-neoforge-${{ matrix.line }}
          path: neoforge/build/${{ matrix.build_subdir }}libs/lod-server-support-neoforge*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-neoforge-${{ matrix.line }}
          path: neoforge/build/${{ matrix.build_subdir }}libs/voxy-server-side-neoforge*.jar

  # Tier 3 runs only on lines whose data says they carry it (job EXISTENCE from the matrix,
  # not a step-skip — best-effort/cut lines have no Tier 3 job at all).
  client-gametest:
    needs: setup
    if: needs.setup.outputs.tier3_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.tier3_matrix) }}
    name: Client GameTests ${{ matrix.line }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Source line env
        run: grep -vE '^\s*(#|$)' lines/${{ matrix.line }}/line.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Tier 3 client gametests (retry once on flake)
        run: |
          ./gradlew -PmcLine=${{ matrix.line }} :fabric:runClientGameTest || {
            echo "::warning title=Tier 3 gametest flake (${{ matrix.line }})::runClientGameTest failed once; retrying"
            mkdir -p flake-evidence/tier3
            cp -r fabric/build/${{ matrix.build_subdir }}run/clientGameTest/logs flake-evidence/tier3/logs 2>/dev/null || true
            cp -r fabric/build/${{ matrix.build_subdir }}run/clientGameTest/crash-reports flake-evidence/tier3/crash-reports 2>/dev/null || true
            ./gradlew -PmcLine=${{ matrix.line }} :fabric:runClientGameTest
          }
        timeout-minutes: 35
        env:
          MESA_GL_VERSION_OVERRIDE: "4.5"
          GALLIUM_DRIVER: llvmpipe
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-failure-evidence-client-${{ matrix.line }}
          path: |
            fabric/build/${{ matrix.build_subdir }}run/clientGameTest/logs/
            fabric/build/${{ matrix.build_subdir }}run/clientGameTest/crash-reports/
          if-no-files-found: ignore
          retention-days: 30

  # build-only lines (fold_status != full): compile every loader so the version-hot build
  # arms stay exercised in CI, without gating on test tiers / goldens not yet folded.
  compile-check:
    needs: setup
    if: needs.setup.outputs.compile_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.compile_matrix) }}
    name: Compile ${{ matrix.line }} (build-only, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Source line env
        run: grep -vE '^\s*(#|$)' lines/${{ matrix.line }}/line.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile all loaders
        run: ./gradlew -PmcLine=${{ matrix.line }} :fabric:compileJava :paper:compileJava :neoforge:compileJava

  # THE single required status check (make this the required context in branch protection).
  # Green iff every matrix job passed, OR the change was docs-only (the `changes` job set
  # code=false, so setup and everything downstream were skipped). Because this job runs on
  # `if: always()` and always reports a conclusion, a docs-only PR is never deadlocked.
  required-checks:
    needs: [changes, build, client-gametest, compile-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "docs-only change — matrix skipped; required check passes."
            exit 0
          fi
          build_res="${{ needs.build.result }}"
          tier3_res="${{ needs.client-gametest.result }}"
          compile_res="${{ needs.compile-check.result }}"
          echo "build=$build_res client-gametest=$tier3_res compile-check=$compile_res"
          # build must be exactly success (a setup failure skips it → red). tier3/compile may
          # be 'skipped' when no line carries that lane; that is a legitimate pass.
          [ "$build_res" = "success" ] || { echo "::error::build matrix failed"; exit 1; }
          case "$tier3_res" in
            success|skipped) ;;
            *) echo "::error::client-gametest matrix failed"; exit 1;;
          esac
          case "$compile_res" in
            success|skipped) ;;
            *) echo "::error::compile-check matrix failed"; exit 1;;
          esac
          echo "all required matrix jobs green."
