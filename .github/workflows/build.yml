name: Build

on:
  push:
    branches: [main, 'support/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main, 'support/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']

# Common tests have a fixed Java 21 runtime, independent of the Minecraft build JDK.
env:
  COMMON_TEST_JAVA_VERSION: 21

jobs:
  build:
    name: Build + Unit Tests + Server GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Line identity comes from .github/line.env (R2-2 — build.yml used to hardcode
      # the Java version and went red-by-construction on the Java-21 line).
      - name: Source line env
        run: grep -vE '^\s*(#|$)' .github/line.env >> "$GITHUB_ENV"

      - name: Install Java 21 for common tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.COMMON_TEST_JAVA_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LINE_JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Fabric + Tier 1 tests
        run: ./gradlew :fabric:build -x runGameTest -x runClientGameTest

      # A red is explained, not retried. The one exception is a failure whose cause is named
      # in config/test-flakes.json (open, unexpired): tools/verify/flake_gate.py allows one
      # retry only when every failure of the first attempt matches such an entry. The first
      # attempt's evidence is always kept.
      - name: Tier 2 server gametests
        run: |
          set -o pipefail
          ./gradlew :fabric:runGameTest 2>&1 | tee first-attempt-tier2.log || {
            mkdir -p flake-evidence/tier2
            cp first-attempt-tier2.log flake-evidence/tier2/ 2>/dev/null || true
            cp -r fabric/build/run/gameTest/logs flake-evidence/tier2/logs 2>/dev/null || true
            cp -r fabric/build/run/gameTest/crash-reports flake-evidence/tier2/crash-reports 2>/dev/null || true
            python3 tools/verify/flake_gate.py --scope tier2 --log first-attempt-tier2.log || exit 1
            echo "::warning title=Known Tier 2 flake retried::see the gametest-flake-evidence-server artifact"
            ./gradlew :fabric:runGameTest
          }

      - name: Build Paper plugin
        run: ./gradlew :paper:shadowJar

      - name: Paper Tier 1 tests
        run: ./gradlew :paper:test

      # Stage N: the NeoForge module (best-effort tier — CLAUDE.md "Support tiers").
      # build = compile (xplat under MDG — the twin-contract enforcement) + the contract
      # suite + shadowJar + the VSS repackage; the gametest smoke runs the 8-test subset
      # under the same retry rule as the fabric tiers.
      - name: Build NeoForge + contract tests
        run: ./gradlew :neoforge:build

      - name: NeoForge gametest smoke
        run: |
          set -o pipefail
          ./gradlew :neoforge:runGameTestServer 2>&1 | tee first-attempt-neoforge.log || {
            mkdir -p flake-evidence/neoforge
            cp first-attempt-neoforge.log flake-evidence/neoforge/ 2>/dev/null || true
            cp -r neoforge/run/logs flake-evidence/neoforge/logs 2>/dev/null || true
            cp -r neoforge/run/crash-reports flake-evidence/neoforge/crash-reports 2>/dev/null || true
            python3 tools/verify/flake_gate.py --scope neoforge --log first-attempt-neoforge.log || exit 1
            echo "::warning title=Known NeoForge flake retried::see the gametest-flake-evidence-server artifact under neoforge/"
            ./gradlew :neoforge:runGameTestServer
          }

      # The SpongeVanilla plugin (best-effort + experimental tier, sponge-support-plan.md
      # §2.3): Tier 1 contract suite + the release shadowJar + the VSS repackage.
      - name: Build Sponge + contract tests
        run: ./gradlew :sponge:build

      # The two-phase boot smoke (§5.2): the BUILT release jar on the line's pinned
      # SpongeVanilla server — hooks fire, a disk-read serve, the permission defaults.
      # The server jar + its first-boot library closure are cached per pinned build; an
      # expired RC/snapshot pin is a "refresh the pin" failure, never a re-run (flake
      # catalog). Same retry rule and first-attempt evidence as the gametests.
      - name: Cache the pinned SpongeVanilla server
        uses: actions/cache@v4
        with:
          path: ~/.cache/lss-sponge
          key: spongevanilla-${{ hashFiles('gradle.properties') }}

      - name: Sponge boot smoke
        run: |
          set -o pipefail
          ./gradlew :sponge:bootSmoke 2>&1 | tee first-attempt-sponge.log || {
            mkdir -p flake-evidence/sponge
            cp first-attempt-sponge.log flake-evidence/sponge/ 2>/dev/null || true
            # Logs + verdicts only: the run dir's libraries/ symlinks the ~150 MB cached
            # SpongeVanilla closure, and the world is regenerated per run.
            rsync -a --exclude libraries --exclude world sponge/build/sponge-smoke flake-evidence/sponge/ 2>/dev/null || true
            python3 tools/verify/flake_gate.py --scope sponge --log first-attempt-sponge.log || exit 1
            echo "::warning title=Known Sponge boot flake retried::see the gametest-flake-evidence-server artifact under sponge/"
            ./gradlew :sponge:bootSmoke
          }

      - name: Isolated harness ownership + result fixtures
        run: |
          ./gradlew :common:settingsCliClasspath --no-parallel
          python3 scripts/test_harness.py
          bash -n scripts/lib/harness-lock.sh
          bash -n scripts/lib/mc-run.sh
          for script in soak benchmark benchmark_compare profile_disk_read backfill_profile store_gate compress_gate store_offline_edit store_migration_gate summary_evicted stamp_heal store_save_storm; do
            bash -n "scripts/$script.sh"
          done

      - name: Soak checker + report selftests
        run: |
          python3 scripts/check_soak.py --selftest
          python3 scripts/soak_report.py --selftest
          python3 scripts/release_check.py --selftest
          python3 scripts/check_move_trace.py --selftest
          python3 scripts/compare_profile.py --selftest
          python3 scripts/check_journeymap_smoke.py --selftest

      - name: Release-jar safety gate
        run: python3 scripts/release_check.py

      - name: Verify fixture classes stay out of maintained artifacts
        run: |
          python3 tools/tests/inventory.py validate-moves
          python3 tools/tests/check_artifacts.py

      - name: Upload first-attempt evidence of a failed gametest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-flake-evidence-server
          path: flake-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-failure-evidence-server
          path: |
            fabric/build/run/*/logs/
            fabric/build/run/*/crash-reports/
            fabric/build/reports/
            common/build/test-results/
            fabric/build/test-results/
            paper/build/reports/
            paper/build/test-results/
            neoforge/build/reports/
            neoforge/build/test-results/
            neoforge/run/logs/
            neoforge/run/crash-reports/
            sponge/build/reports/
            sponge/build/test-results/
            sponge/build/sponge-smoke/
            !sponge/build/sponge-smoke/run/libraries/**
            !sponge/build/sponge-smoke/run/world/**
          if-no-files-found: ignore
          retention-days: 30

      # The shipped jars per loader: the LSS jar and the branded Voxy Server Side twin (produced by the
      # vssJar repackage tasks — Fabric's runs as a `build` dependency, Paper's as a shadowJar
      # finalizer). Explicit per-brand globs so each artifact holds only its own jar.
      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-fabric
          path: fabric/build/libs/lod-server-support-fabric*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-paper
          path: paper/build/libs/lod-server-support-paper*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-fabric
          path: fabric/build/libs/voxy-server-side-fabric*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-paper
          path: paper/build/libs/voxy-server-side-paper*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-neoforge
          path: neoforge/build/libs/lod-server-support-neoforge*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-neoforge
          path: neoforge/build/libs/voxy-server-side-neoforge*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: lod-server-support-sponge
          path: sponge/build/libs/lod-server-support-sponge*.jar

      - uses: actions/upload-artifact@v5
        with:
          name: voxy-server-side-sponge
          path: sponge/build/libs/voxy-server-side-sponge*.jar

  # Tier 3: the only end-to-end pins for the client-server flow, LSSApi consumer
  # dispatch, the ingest-failure recovery loop, and the IntegratedServerLanHook path.
  # Runs headless via llvmpipe (same env the original Tier-3 job used on these runners).
  client-gametest:
    name: Client GameTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Line identity comes from .github/line.env (R2-2 — build.yml used to hardcode
      # the Java version and went red-by-construction on the Java-21 line).
      - name: Source line env
        run: grep -vE '^\s*(#|$)' .github/line.env >> "$GITHUB_ENV"

      - name: Install Java 21 for common tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.COMMON_TEST_JAVA_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LINE_JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      # The same retry rule as Tier 2. The one named cause on this tier is the vanilla
      # TicketStorage purge crash under ticket churn (config/test-flakes.json).
      - name: Tier 3 client gametests
        run: |
          set -o pipefail
          ./gradlew :fabric:runClientGameTest 2>&1 | tee first-attempt-tier3.log || {
            mkdir -p flake-evidence/tier3
            cp first-attempt-tier3.log flake-evidence/tier3/ 2>/dev/null || true
            cp -r fabric/build/run/clientGameTest/logs flake-evidence/tier3/logs 2>/dev/null || true
            cp -r fabric/build/run/clientGameTest/crash-reports flake-evidence/tier3/crash-reports 2>/dev/null || true
            cat flake-evidence/tier3/crash-reports/*.txt >> first-attempt-tier3.log 2>/dev/null || true
            python3 tools/verify/flake_gate.py --scope tier3 --log first-attempt-tier3.log || exit 1
            echo "::warning title=Known Tier 3 flake retried::see the gametest-flake-evidence-client artifact"
            ./gradlew :fabric:runClientGameTest
          }
        timeout-minutes: 35
        env:
          MESA_GL_VERSION_OVERRIDE: "4.5"
          GALLIUM_DRIVER: llvmpipe

      - name: Upload first-attempt evidence of a failed gametest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-flake-evidence-client
          path: flake-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-failure-evidence-client
          path: |
            fabric/build/run/clientGameTest/logs/
            fabric/build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
          retention-days: 30
