name: Compatibility and support-line contracts
on:
  push:
    branches: [main, 'support/**']
  pull_request:
    branches: [main, 'support/**']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Settings tools execute the product Java codec; Gradle configures every
      # platform, so install both the common runtime and this line's build JDK.
      - name: Source line env
        run: grep -vE '^\s*(#|$)' .github/line.env >> "$GITHUB_ENV"
      - name: Install Java 21 for settings tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install line build JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LINE_JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Pinned metadata parser
        run: python3 -m pip install -r tools/compat/requirements.txt
      - name: Offline catalog, line, rig and impact regression tests
        run: |
          python3 -m unittest discover -s tools/compat
          python3 -m unittest discover -s tools/lines
          python3 -m unittest discover -s tools/release
          python3 -m unittest discover -s tools/rig
          python3 -m unittest discover -s tools/verify
          python3 -m unittest discover -s tools/tests
          python3 -m unittest discover -s test-fixtures/client-preset-tools
      # Every line: its facts and its role. A support line also proves it is in step with main,
      # and the change itself is checked against where it started (the target branch for a pull
      # request, the previous tip for a push). docs/operations/support-lines.md has the rules.
      - name: Line facts, role and sync with main
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="HEAD^1"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then base="$BEFORE"; fi
          python3 tools/compat/ci.py --fetch ${base:+--base "$base"}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: compatibility-candidate-report
          path: compatibility-candidate-report.json
